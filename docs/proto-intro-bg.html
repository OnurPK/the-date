<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign-in screen — background candidates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0d13;color:#e7deff;font:500 13px/1.5 Inter,system-ui,sans-serif;padding:20px}
h1{font:600 20px "Playfair Display",Georgia,serif;margin:0 0 4px}
p.sub{color:#8a80a4;margin:0 0 14px;font-size:12px}
.grid{display:flex;gap:18px;flex-wrap:wrap}
.card{width:390px;zoom:.6}
.card h2{font:600 15px "Playfair Display",Georgia,serif;margin:0 0 8px;color:#fff}
.ph{position:relative;width:390px;height:844px;border-radius:38px;overflow:hidden;background:#000;border:6px solid #17141c}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.25) 45%,rgba(0,0,0,.55))}
.top{position:absolute;left:18px;top:26px;display:flex;gap:8px}
.pill{border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 16px;font:800 12px Inter;color:#fff}
.snd{position:absolute;left:18px;top:74px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(14,10,20,.55)}
.demo{position:absolute;right:18px;top:26px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:6px 14px;font:800 11px Inter;color:#fff;letter-spacing:.2em}
.logo{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);text-align:center}
.logo img{width:230px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7))}
.logo .tag{margin-top:6px;font:700 11px Inter;letter-spacing:.32em;color:#e8dfd6}
.start{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:160px;padding:15px 0;border-radius:999px;background:#fff;color:#111;text-align:center;font:800 15px Inter;letter-spacing:.32em;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sign{position:absolute;left:50%;top:72%;transform:translateX(-50%);font:800 12px Inter;letter-spacing:.32em;color:#fff;border-bottom:1.5px solid rgba(255,255,255,.6);padding-bottom:6px}
</style></head><body>
<h1>Sign-in screen — background candidates (gpt-image-2.5)</h1>
<p class="sub">Same UI on top of each. Three Pride &amp; Prejudice moods, three roles.ai concepts. The files are 1440×2560 under _mockups/intro_bg/.</p>
<div class="grid" id="grid"></div>
<script>
const B='../worlds/pride-and-prejudice/_mockups/intro_bg/';
const V=[['pp_ball_bright','P&P 4 · assembly ball in full swing, she looks back'],['pp_garden','P&P 5 · sunlit garden, letter in hand'],['pp_carriage','P&P 6 · open carriage, bright morning road'],['ra_worlds_bright','roles.ai 4 · doors into worlds, theatre lobby'],['ra_casting_bright','roles.ai 5 · lively film set between takes'],['ra_friends_bright','roles.ai 6 · new friends, best friends — stage edge'],['pp_ballroom','P&P 1 · ballroom from a dark doorway, a dropped glove'],['pp_letter','P&P 2 · sealed letter, quill, one candle'],['pp_rain_window','P&P 3 · rain window, lantern on the lawn, her shoulder'],['ra_worlds','roles.ai 1 · worlds being born (dioramas)'],['ra_casting','roles.ai 2 · casting chair under a spotlight'],['ra_masks','roles.ai 3 · backstage mirror, characters\' faces']];
document.getElementById('grid').innerHTML=V.map(([f,t])=>`<div class="card"><h2>${t}</h2><div class="ph"><div class="bg" style="background-image:url('${B}${f}.png')"></div><div class="dim"></div>
<div class="top"><span class="pill">V1 →</span></div><div class="snd"></div><div class="demo">DEMO</div>
<div class="logo"><img src="../assets/ui/logo.png" alt=""><div class="tag">NEW FRIENDS, BEST FRIENDS.</div></div><div class="start">START</div><div class="sign">SIGN IN</div></div></div>`).join('');
</script></body></html>
