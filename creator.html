/* ============================================================
   DATA LAYER
   v0.1 stores everything in localStorage. Wire to Cloudflare
   D1 + R2 in v0.2.
============================================================ */
const STORAGE_KEY = 'roles-ai-creator/v0.1';
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Shallow merge defaults so new keys get filled if storage is older.
      return { ...DEFAULT_DATA, ...parsed };
    }
  } catch (e) { console.warn('[creator] load failed', e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
  catch (e) { console.warn('[creator] save failed', e); }
}
function newId(prefix) {
  return prefix + '-' + Math.random().toString(36).slice(2, 8);
}

}

/* ============================================================
   CANVAS
   The React Flow graph for the currently-selected episode.
============================================================ */
function Canvas({ episode, onGraphChange, onSelectNode }) {
  const [nodes, setNodes] = useState([]);
  const [edges, setEdges] = useState([]);

  // Sync from props when episode changes
  useEffect(() => {
    if (episode && episode.graph) {
      setNodes(episode.graph.nodes || []);
      setEdges(episode.graph.edges || []);
    } else {
      setNodes([]);
      setEdges([]);
    }
  }, [episode && episode.id]);

  const onNodesChange = useCallback((changes) => {
    setNodes((nds) => {
      const next = applyNodeChanges(changes, nds);
      onGraphChange({ nodes: next, edges });
      return next;
    });
  }, [edges, onGraphChange]);

  const onEdgesChange = useCallback((changes) => {
    setEdges((eds) => {
      const next = applyEdgeChanges(changes, eds);
      onGraphChange({ nodes, edges: next });
      return next;
    });
  }, [nodes, onGraphChange]);

  const onConnect = useCallback((connection) => {
    setEdges((eds) => {
      const next = addEdge({ ...connection, id: newId('edge') }, eds);
      onGraphChange({ nodes, edges: next });
      return next;
    });
  }, [nodes, onGraphChange]);

  const onSelectionChange = useCallback(({ nodes: sel }) => {
    onSelectNode(sel && sel[0] ? sel[0].id : null);
  }, [onSelectNode]);

  if (!episode) {
    return html`
      <div className="canvas-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
          <circle cx="6"  cy="6"  r="3"/>
          <circle cx="18" cy="6"  r="3"/>
          <circle cx="6"  cy="18" r="3"/>
          <circle cx="18" cy="18" r="3"/>
          <path d="M9 6h6M6 9v6M18 9v6M9 18h6"/>
        </svg>
        <h3>No episode selected</h3>
        <p>Pick an episode from the sidebar, or create a new one. Each episode is a free-form node graph: dialog beats, choices, cutscenes, explore sections, music endings.</p>
      </div>
    `;
  }

  return html`
    <${ReactFlow}
      nodes=${nodes}
      edges=${edges}
      onNodesChange=${onNodesChange}
      onEdgesChange=${onEdgesChange}
      onConnect=${onConnect}
      onSelectionChange=${onSelectionChange}
      nodeTypes=${NODE_TYPES}
      fitView
      proOptions=${{ hideAttribution: true }}
    >
      <${Background} variant="dots" gap=${24} size=${1} color="rgba(255,255,255,0.06)" />
      <${Controls} />
      <${MiniMap} nodeColor=${() => '#ff7eb9'} maskColor="rgba(0,0,0,0.6)" />
    </${ReactFlow}>
  `;
}

/* ============================================================
   APP ROOT
============================================================ */
function App() {
  const [data, setData] = useState(loadData);
  const [selectedEpisode, setSelectedEpisode] = useState(null);
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [savedFlash, setSavedFlash] = useState(false);

  // Persist on every change.
  useEffect(() => {
    saveData(data);
    setSavedFlash(true);
    const t = setTimeout(() => setSavedFlash(false), 600);
    return () => clearTimeout(t);
  }, [data]);

  const episode = selectedEpisode ? data.episodes[selectedEpisode] : null;
  const selectedNode = (episode && episode.graph && selectedNodeId)
    ? (episode.graph.nodes || []).find(n => n.id === selectedNodeId)
    : null;

  const onGraphChange = useCallback((graph) => {
    if (!selectedEpisode) return;
    setData(d => ({
      ...d,
      episodes: {
        ...d.episodes,
        [selectedEpisode]: { ...d.episodes[selectedEpisode], graph }
      }
    }));
  }, [selectedEpisode]);

  const onUpdateNode = useCallback((nodeId, dataPatch) => {
    if (!selectedEpisode) return;
    setData(d => {
      const ep = d.episodes[selectedEpisode];
      const newNodes = (ep.graph.nodes || []).map(n =>
        n.id === nodeId ? { ...n, data: dataPatch } : n
      );
      return {
        ...d,
        episodes: {
          ...d.episodes,
          [selectedEpisode]: { ...ep, graph: { ...ep.graph, nodes: newNodes } }
        }
      };
    });
  }, [selectedEpisode]);

  const onDeleteNode = useCallback((nodeId) => {
    if (!selectedEpisode) return;
    setData(d => {
      const ep = d.episodes[selectedEpisode];
      const newNodes = (ep.graph.nodes || []).filter(n => n.id !== nodeId);
      const newEdges = (ep.graph.edges || []).filter(e => e.source !== nodeId && e.target !== nodeId);
      return {
        ...d,
        episodes: {
          ...d.episodes,
          [selectedEpisode]: { ...ep, graph: { nodes: newNodes, edges: newEdges } }
        }
      };
    });
    setSelectedNodeId(null);
  }, [selectedEpisode]);

  const onAddNode = useCallback((type) => {
    if (!selectedEpisode) return;
    const newNode = {
      id: newId(type),
      type,
      position: { x: 200 + Math.random() * 200, y: 200 + Math.random() * 100 },
      data: type === 'beat'     ? { title: 'New beat', lines: [{ speaker: 'narrative', text: '' }] }
          : type === 'choice'   ? { prompt: 'Pick one', options: [{ id: newId('opt'), label: '' }] }
          : type === 'cutscene' ? { title: 'Cutscene', image: '', caption: '' }
          : type === 'explore'  ? { title: 'Look around', duration: 30, objects: [] }
          : type === 'music'    ? { title: 'Generate Reel' }
          : type === 'end'      ? { title: 'End' }
          : {},
    };
    setData(d => {
      const ep = d.episodes[selectedEpisode];
      const newNodes = [...(ep.graph.nodes || []), newNode];
      return {
        ...d,
        episodes: {
          ...d.episodes,
          [selectedEpisode]: { ...ep, graph: { ...ep.graph, nodes: newNodes } }
        }
      };
    });
  }, [selectedEpisode]);

  const onCreateEpisode = useCallback((locationId) => {
    const title = prompt('Episode title?');
    if (!title) return;
    const id = newId('ep');
    setData(d => ({
      ...d,
      episodes: {
        ...d.episodes,
        [id]: {
          id,
          locationId,
          title,
          cast: {},
          graph: {
            nodes: [{
              id: 'start',
              type: 'beat',
              position: { x: 100, y: 100 },
              data: { title: 'Opening', lines: [] },
            }],
            edges: [],
          },
        }
      }
    }));
    setSelectedEpisode(id);
  }, []);

  const onCreateLocation = useCallback((worldId) => {
    const title = prompt('Location title?');
    if (!title) return;
    const id = newId('loc');
    setData(d => ({
      ...d,
      locations: {
        ...d.locations,
        [id]: { id, worldId, title, kind: '', cover: '' }
      }
    }));
  }, []);

  const onCreateWorld = useCallback(() => {
    const name = prompt('World name?');
    if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    setData(d => ({
      ...d,
      worlds: { ...d.worlds, [id]: { id, name, mapImage: '' } }
    }));
  }, []);

  const exportEpisodeJSON = () => {
    if (!episode) { alert('Select an episode first.'); return; }
    const blob = new Blob([JSON.stringify(episode, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${episode.id}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const resetAll = () => {
    if (!confirm('Reset to default data? This wipes your local changes.')) return;
    localStorage.removeItem(STORAGE_KEY);
    setData(loadData());
    setSelectedEpisode(null);
    setSelectedNodeId(null);
  };

  // Breadcrumb string
  const crumb = useMemo(() => {
    if (!episode) return 'Pick an episode';
    const loc = data.locations[episode.locationId];
    const wld = loc ? data.worlds[loc.worldId] : null;
    return html`<b>${wld ? wld.name : '?'}</b> &nbsp;›&nbsp; ${loc ? loc.title : '?'} &nbsp;›&nbsp; <b>${episode.title}</b>`;
  }, [episode, data]);

  return html`
    <div className="creator-root">
      <header className="creator-topbar">
        <span className="creator-logo">
          <span className="accent">●</span> roles<span className="accent">.ai</span> · creator
        </span>
        <div className="creator-breadcrumb">${crumb}</div>
        <div className="creator-actions">
          <span className=${'save-status' + (savedFlash ? ' show' : '')}>Saved</span>
          <button onClick=${exportEpisodeJSON} disabled=${!episode}>Export JSON</button>
          <button onClick=${resetAll}>Reset</button>
        </div>
      </header>
      <div className="creator-main">
        <aside className="creator-sidebar">
          <${Sidebar}
            data=${data}
            selectedEpisode=${selectedEpisode}
            onSelectEpisode=${(id) => { setSelectedEpisode(id); setSelectedNodeId(null); }}
            onCreateEpisode=${onCreateEpisode}
            onCreateLocation=${onCreateLocation}
            onCreateWorld=${onCreateWorld} />
        </aside>
        <section className="creator-canvas">
          ${episode ? html`
            <div className="canvas-toolbar">
              <button onClick=${() => onAddNode('beat')}>+ Beat</button>
              <button onClick=${() => onAddNode('choice')}>+ Choice</button>
              <button onClick=${() => onAddNode('cutscene')}>+ Cutscene</button>
              <button onClick=${() => onAddNode('explore')}>+ Explore</button>
              <div className="sep"></div>
              <button onClick=${() => onAddNode('music')}>+ Music</button>
              <button onClick=${() => onAddNode('end')}>+ End</button>
            </div>
          ` : null}
          <${ReactFlowProvider}>
            <${Canvas}
              episode=${episode}
              onGraphChange=${onGraphChange}
              onSelectNode=${setSelectedNodeId} />
          </${ReactFlowProvider}>
        </section>
        <aside className="creator-right">
          <div className="right-pane">
            <div className="right-pane-title">
              <span>Inspector</span>
              ${selectedNode ? html`<span className="pill">${selectedNode.type}</span>` : null}
            </div>
            <div className="right-pane-body">
              <${Inspector}
                episode=${episode}
                node=${selectedNode}
                onUpdate=${onUpdateNode}
                onDelete=${onDeleteNode} />
            </div>
          </div>
          <div className="right-pane">
            <div className="right-pane-title">
              <span>Live Preview</span>
              <div className="preview-controls">
                <button onClick=${() => {
                  const f = document.querySelector('.preview-frame');
                  if (f) f.src = f.src;
                }}>Reload</button>
              </div>
            </div>
            <iframe className="preview-frame" src="dialog.html?noredirect=1" title="Live preview"></iframe>
          </div>
        </aside>
      </div>
    </div>
  `;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
